<div class="row justify-content-center mt-4">
      <div class="col-md-8">
        <form class="row g-2" #f="ngForm" (ngSubmit)="agregarValor()">
          <div class="col-auto">
            <select class="form-select bg-success" (change)="tipoOperacion($event)">
              <option value="ingresoOperacion" selected>+</option>
              <option value="egresoOperacion">-</option>
            </select>
          </div>
          <div class="col">
            <input type="text" name="descripcionInput" class="form-control border-success" placeholder="Descripción" [(ngModel)]="descripcionInput" required />
          </div>
          <div class="col-auto">
            <input type="number" name="precioInput" class="form-control border-success" placeholder="Valor" [(ngModel)]="precioInput" required />
          </div>
          <div class="col-auto">
            <button type="submit" class="btn btn-success">
              <i class="bi bi-check-circle"></i> <!-- Bootstrap Icon -->
            </button>
          </div>
        </form>
      </div>
    </div>
